apiVersion: apps/v1
kind: Deployment
metadata:
  name: bot
  namespace: tokped-sniper
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: bot
  template:
    metadata:
      labels:
        app: bot
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - node-rst.us-central1-f.c.tokped-sniper.internal
                      - node-fhz.us-central1-b.c.main-proj-454016.internal
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: bot
              topologyKey: kubernetes.io/hostname
      dnsPolicy: "None"
      dnsConfig:
        nameservers:
          - "10.43.0.10"
          - "8.8.8.8"
        searches:
          - tokped-sniper.svc.cluster.local
          - svc.cluster.local
          - cluster.local
        options:
          - name: ndots
            value: "5"
      containers:
        - name: bot
          image: ghcr.io/slickerius/tokped-sniper:latest
          imagePullPolicy: Always
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bot-secret
                  key: BOT_TOKEN
            - name: CHANNEL_ID
              valueFrom:
                secretKeyRef:
                  name: bot-secret
                  key: CHANNEL_ID
            - name: OWNER_ID
              valueFrom:
                secretKeyRef:
                  name: bot-secret
                  key: OWNER_ID
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bot-secret
                  key: DB_PASSWORD
          envFrom:
            - configMapRef:
                name: bot-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      imagePullSecrets:
        - name: ghcr-secret
