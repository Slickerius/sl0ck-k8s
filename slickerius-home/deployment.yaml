apiVersion: apps/v1
kind: Deployment
metadata:
  name: slickerius-home
  namespace: slickerius-home
spec:
  replicas: 2
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: slickerius-home
  template:
    metadata:
      labels:
        app: slickerius-home
    spec:
      # Stay on the same node as ingress-nginx. Cross-node pod-to-Service traffic is unreliable on this cluster.
      nodeSelector:
        kubernetes.io/hostname: vps-01
      imagePullSecrets:
        - name: ghcr-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # The :latest tag is only the bootstrap value. CI pins the container to :<git-sha> on every deploy.
          image: ghcr.io/slickerius/slickerius-home:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
