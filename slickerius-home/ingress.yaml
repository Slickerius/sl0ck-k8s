# The two www names serve the site. from-to-www-redirect sends each bare domain (slickeri.us, slickerius.net) to its
# own www counterpart with a permanent redirect that keeps the path and query string.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: slickerius-home
  namespace: slickerius-home
  annotations:
    nginx.ingress.kubernetes.io/from-to-www-redirect: "true"
    nginx.ingress.kubernetes.io/limit-rps: "30"
    nginx.ingress.kubernetes.io/limit-connections: "60"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - www.slickeri.us
        - www.slickerius.net
        - slickeri.us
        - slickerius.net
      secretName: slickerius-home-tls
  rules:
    - host: www.slickeri.us
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: slickerius-home
                port:
                  number: 80
    - host: www.slickerius.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: slickerius-home
                port:
                  number: 80
