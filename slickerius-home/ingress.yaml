# All four names reach the same pods. The pod's nginx sends the bare domains (slickeri.us, slickerius.net) to their own
# www counterpart. ingress-nginx from-to-www-redirect is not used because it puts the internal :442 port in the URL.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: slickerius-home
  namespace: slickerius-home
  annotations:
    nginx.ingress.kubernetes.io/limit-rps: "30"
    nginx.ingress.kubernetes.io/limit-connections: "60"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - www.slickeri.us
        - www.slickerius.net
        - slickeri.us
        - slickerius.net
      secretName: slickerius-home-tls
  rules:
    - host: www.slickeri.us
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: slickerius-home
                port:
                  number: 80
    - host: www.slickerius.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: slickerius-home
                port:
                  number: 80
    - host: slickeri.us
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: slickerius-home
                port:
                  number: 80
    - host: slickerius.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: slickerius-home
                port:
                  number: 80
