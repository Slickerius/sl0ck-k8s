apiVersion: apps/v1
kind: Deployment
metadata:
  name: irnusdl
  namespace: irnusdl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: irnusdl
  template:
    metadata:
      labels:
        app: irnusdl
    spec:
      # Pin to node-jw — k3s local-path PV and SQLite require a fixed node
      nodeSelector:
        kubernetes.io/hostname: node-jw.us-central1-b.c.eighth-pursuit-404222.internal

      initContainers:
        # Copy baked-in static files from the app image into the shared volume
        - name: init-statics
          image: ghcr.io/slickerius/irnusdl:latest
          imagePullPolicy: Always
          command: ["sh", "-c", "cp -r /usr/src/app/static/. /mnt/static/"]
          volumeMounts:
            - name: static-files
              mountPath: /mnt/static

        # Run Django migrations before gunicorn starts
        - name: init-migrate
          image: ghcr.io/slickerius/irnusdl:latest
          imagePullPolicy: Always
          command: ["python", "manage.py", "migrate", "--no-input"]
          env:
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: irnusdl-secret
                  key: DJANGO_SECRET_KEY
            - name: SQLITE_DB_PATH
              value: /data/db.sqlite3
          volumeMounts:
            - name: sqlite-data
              mountPath: /data

      containers:
        - name: web
          image: ghcr.io/slickerius/irnusdl:latest
          imagePullPolicy: Always
          env:
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: irnusdl-secret
                  key: DJANGO_SECRET_KEY
            - name: SQLITE_DB_PATH
              value: /data/db.sqlite3
          command:
            - gunicorn
            - --bind
            - 0.0.0.0:8000
            - irnuscrawler.asgi
            - -k
            - uvicorn.workers.UvicornWorker
          volumeMounts:
            - name: sqlite-data
              mountPath: /data
            - name: static-files
              mountPath: /usr/src/app/static/tmp
              subPath: tmp
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"

        - name: tmp-cleanup
          image: busybox
          command: ["sh", "-c", "while true; do find /tmp-files -type f -mmin +60 -delete; sleep 3600; done"]
          volumeMounts:
            - name: static-files
              mountPath: /tmp-files
              subPath: tmp
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "32Mi"
              cpu: "50m"

        - name: nginx
          image: nginx:1.25
          ports:
            - containerPort: 80
            - containerPort: 443
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: tls-certs
              mountPath: /certificates
              readOnly: true
            - name: static-files
              mountPath: /home/app/web/static
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"

      volumes:
        - name: sqlite-data
          persistentVolumeClaim:
            claimName: sqlite-data
        - name: static-files
          emptyDir: {}
        - name: nginx-config
          configMap:
            name: nginx-config
        - name: tls-certs
          secret:
            secretName: irnusdl-tls
            items:
              - key: tls.crt
                path: fullchain.pem
              - key: tls.key
                path: privkey.pem

      imagePullSecrets:
        - name: ghcr-secret
